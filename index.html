<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Liga jadvali</title>
  <meta name="google-site-verification" content="THn9MBHnkD3zvY2tJTp5gF8ArSjA3lbgppIfvbB20fY" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --turf: #0f3d2c;
    --chalk: #f3f6f0;
    --ink: #14231b;
    --muted: #5e7068;
    --line: #d5ded3;
    --flag: #f0bf2a;
    --ucl: #2f5bd3;
    --down: #c23b2a;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--chalk); color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    line-height: 1.45;
  }
  .num, h1, h2 { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; }

  /* ---- sarlavha: futbol maydoni chiziqlari ---- */
  header {
    position: relative; overflow: hidden; background: var(--turf); color: #fff;
    padding: 44px 20px 40px;
  }
  header svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .head-in { position: relative; max-width: 960px; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(40px, 9vw, 76px); font-weight: 700; line-height: .95; letter-spacing: .5px; }
  .sub { margin-top: 12px; color: #bcd3c6; font-size: 15px; }
  .sub b { color: var(--flag); font-weight: 600; }

  main { max-width: 960px; margin: 0 auto; padding: 22px 14px 40px; display: grid; gap: 26px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  h2 { margin: 0; padding: 14px 16px 10px; font-size: 24px; font-weight: 600; }
  .wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 9px 8px; text-align: center; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--line); }
  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: 0; }
  td.l, th.l { text-align: left; }
  td.pos { border-left: 4px solid transparent; font-weight: 600; width: 44px; }
  tr.z-ucl td.pos { border-left-color: var(--ucl); }
  tr.z-down td.pos { border-left-color: var(--down); }
  .team { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .team img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  .pts { font-family: "Barlow Condensed", sans-serif; font-size: 20px; font-weight: 700; }
  .goals { font-family: "Barlow Condensed", sans-serif; font-size: 20px; font-weight: 700; }
  td.dim { color: var(--muted); }
  tr.lead td { background: #fbf6e2; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 16px 14px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
  .legend i { display: inline-block; width: 4px; height: 14px; vertical-align: -2px; margin-right: 6px; }

  .msg { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; }
  .msg.err { color: var(--down); }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 34px; }

  @media (max-width: 640px) {
    .hide-sm { display: none; }
    th, td { padding: 9px 6px; }
    table { font-size: 14px; }
  }
  :focus-visible { outline: 3px solid var(--ucl); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 960 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="2">
      <line x1="760" y1="-10" x2="760" y2="250"/>
      <circle cx="760" cy="120" r="82"/>
      <rect x="560" y="40" width="0" height="0"/>
      <path d="M960 52 H880 V188 H960"/>
      <path d="M960 88 H928 V152 H960"/>
    </g>
    <circle cx="760" cy="120" r="4" fill="#fff" fill-opacity=".25"/>
  </svg>
  <div class="head-in">
    <h1>La Liga</h1>
    <div class="sub" id="sub">Yuklanmoqda…</div>
  </div>
</header>

<main>
  <section>
    <h2>Turnir jadvali</h2>
    <div class="wrap"><table id="table"></table></div>
    <div class="legend">
      <span><i style="background:var(--ucl)"></i>Chempionlar ligasi (1–4)</span>
      <span><i style="background:var(--down)"></i>Pastga tushish zonasi (18–20)</span>
    </div>
  </section>

  <section>
    <h2>Eng yaxshi to'purarlar</h2>
    <div class="wrap"><table id="scorers"></table></div>
  </section>

  <div class="msg" id="msg" role="status"></div>
</main>

<footer>Ma'lumot manbasi: football-data.org. Natijalar biroz kechikib yangilanishi mumkin.</footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(d) {
  const when = new Date(d.updated);
  const time = isNaN(when) ? '' : when.toLocaleString('uz-UZ', {hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'});
  document.getElementById('sub').innerHTML =
    (d.matchday ? '<b>' + esc(d.matchday) + '-tur.</b> ' : '') + (time ? 'Oxirgi yangilanish: ' + esc(time) : '');

  const n = d.table.length;
  let t = '<thead><tr><th>#</th><th class="l">Jamoa</th><th>O</th><th class="hide-sm">G</th><th class="hide-sm">D</th><th class="hide-sm">M</th><th class="hide-sm">TO</th><th class="hide-sm">YO</th><th>+/−</th><th>Ochko</th></tr></thead><tbody>';
  d.table.forEach(r => {
    const zone = r.pos <= 4 ? 'z-ucl' : (r.pos > n - 3 ? 'z-down' : '');
    t += `<tr class="${zone}${r.pos === 1 ? ' lead' : ''}">
      <td class="pos num">${esc(r.pos)}</td>
      <td class="l"><span class="team">${r.crest ? `<img src="${esc(r.crest)}" alt="" loading="lazy">` : ''}${esc(r.team)}</span></td>
      <td>${esc(r.played)}</td><td class="hide-sm">${esc(r.won)}</td><td class="hide-sm">${esc(r.draw)}</td><td class="hide-sm">${esc(r.lost)}</td>
      <td class="hide-sm dim">${esc(r.gf)}</td><td class="hide-sm dim">${esc(r.ga)}</td><td>${esc(r.gd)}</td>
      <td class="pts">${esc(r.points)}</td></tr>`;
  });
  document.getElementById('table').innerHTML = t + '</tbody>';

  let s = '<thead><tr><th>#</th><th class="l">Futbolchi</th><th class="l">Davlati</th><th class="l hide-sm">Jamoa</th><th>Gol</th><th class="hide-sm">Assist</th><th>Narxi</th></tr></thead><tbody>';
  d.scorers.forEach((p, i) => {
    s += `<tr><td class="num">${i + 1}</td><td class="l">${esc(p.name)}</td><td class="l">${esc(p.nationality)}</td>
      <td class="l hide-sm">${esc(p.team)}</td><td class="goals">${esc(p.goals)}</td><td class="hide-sm">${esc(p.assists)}</td><td>${esc(p.value)}</td></tr>`;
  });
  document.getElementById('scorers').innerHTML = s + '</tbody>';
  document.getElementById('msg').textContent = '';
  document.getElementById('msg').className = 'msg';
}

async function load() {
  const msg = document.getElementById('msg');
  try {
    const res = await fetch('data.json?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
  } catch (e) {
    msg.textContent = "Ma'lumotni yuklab bo'lmadi. Birozdan keyin qayta urinib ko'ring.";
    msg.className = 'msg err';
  }
}

load();
setInterval(load, 60000);   // sahifa ochiq tursa, har daqiqada yangi ma'lumotni tekshiradi
</script>
</body>
</html>
